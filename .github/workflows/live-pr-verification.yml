name: Live PR verification

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Check script syntax
        run: npm run check

      - name: Verify behavior on live PR page
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run verify:live-pr
